[package]
name = "mod-learnordie"
version = "0.1.0"
edition = "2024"

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build). Any other registry dependency must be
# pinned with `horizon-launcher native-lock .` before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }

[dev-dependencies]
# The wiring test dispatches real hook events through the SDK's test support (docs: concepts/testing.md).
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api", features = ["testing"] }
# Block definitions for the server test's resolved block table (the fake level models no block states).
horizon-mod-runtime = { path = ".horizon/sdk/api/crates/horizon-mod-runtime" }
